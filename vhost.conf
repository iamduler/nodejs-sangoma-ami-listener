<VirtualHost *:80>
    ServerName pcb-sangoma-ami.cloudgo.vn

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName pcb-sangoma-ami.cloudgo.vn

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile      /etc/apache2/ssl/cloudgo.cert
    SSLCertificateKeyFile   /etc/apache2/ssl/cloudgo.key

    # ===========================
    # Reverse Proxy to Node.js
    # ===========================
    ProxyPreserveHost On
    ProxyRequests Off
    SSLProxyEngine On

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # ===========================
    # Headers (Express + Proxy)
    # ===========================
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # ===========================
    # Timeout tuning (API)
    # ===========================
    ProxyTimeout 60
    Timeout 60

    # ===========================
    # Logging
    # ===========================
    ErrorLog /var/www/pcb-sangoma-ami.cloudgo.vn/error.log
	CustomLog /var/www/pcb-sangoma-ami.cloudgo.vn/requests.log combined

</VirtualHost>
